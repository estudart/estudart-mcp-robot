services:
  robot-agent-be:
    build:
      context: ./robot-agent-be
      dockerfile: Dockerfile
    container_name: robot-agent-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    env_file:
      - ./robot-agent-be/.env
    environment:
      - MODEL=gpt-4o-mini
      - API_PORT=8080
      - ROBOT_SERVER_URL=http://raspberrypi.local:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  robot-agent-fe:
    build:
      context: ./robot-agent-fe
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ws://localhost:8080
        VITE_BACKEND_REST_URL: http://localhost:8080
    container_name: robot-agent-fe
    restart: unless-stopped
    ports: 
      - "5173:80"
    depends_on: 
      robot-agent-be:
        condition: service_healthy
